<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Loadout logo</title>
  <desc id="description">A violet and cyan targeting reticle on a dark rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="url(#violet)" stroke-width="24"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#22D3EE" stroke-width="18"/>
  <circle cx="256" cy="256" r="19" fill="#22D3EE"/>
  <g stroke="#8B5CF6" stroke-width="24" stroke-linecap="round">
    <line x1="256" y1="74" x2="256" y2="112"/>
    <line x1="256" y1="438" x2="256" y2="400"/>
    <line x1="74" y1="256" x2="112" y2="256"/>
    <line x1="438" y1="256" x2="400" y2="256"/>
  </g>
</svg>
